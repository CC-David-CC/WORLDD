syntax = "proto3";
package spatial.testing.v1;
import "host_session.proto";
message NativeGeometryWitnessRequest {
  uint64 request_id = 1;
  oneof operation {
    spatial.supervisor.v1.HostControlRequest control = 2;
    bool capture = 3;
    bool identity = 4;
    bool shutdown = 5;
    NativeGeometryFdScan fd_scan = 6;
  }
}
message NativeGeometryFdQuery {
  uint64 pid = 1;
  uint64 start_ticks = 2;
  repeated string target_needles = 3;
}
message NativeGeometryFdScan {
  repeated NativeGeometryFdQuery processes = 1;
  uint32 wait_until_absent_ms = 2;
}
message NativeGeometryFdResult {
  uint64 pid = 1;
  uint64 start_ticks = 2;
  repeated string matched_needles = 3;
}
message NativeGeometryProcess {
  uint64 pid = 1;
  uint64 start_ticks = 2;
  bytes executable_sha256 = 3;
}
message NativeGeometryWitnessReply {
  uint64 request_id = 1;
  spatial.supervisor.v1.HostControlReply control = 2;
  bytes pixels = 3;
  repeated NativeGeometryProcess processes = 4;
  string error = 5;
  bool cleanup_complete = 6;
  repeated NativeGeometryFdResult fd_results = 7;
}
