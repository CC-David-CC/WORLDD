syntax = "proto3";
package spatial.testing.v1;
import "core.proto";
import "actor_local_view.proto";
import "broker.proto";
import "launch.proto";
import "issuer.proto";

// Test-driver transport only. Actors never receive this coordinator interface.
message SessionWorldStart {
  string configuration_path = 1;
  int32 native_fd = 2; // One of the fixture's explicitly inherited sealed configurations.
  optional int32 actor_listener_fd = 3; // Explicitly inherited listener; production validates its socket type.
}
message SessionWorldStarted {
  spatial.workspace.v1.ControlOwner owner = 1;
  spatial.supervisor.v1.AuthorityLaunchRecord record = 2;
}
message SessionWorldCall {
  spatial.workspace.v1.ControlOwner owner = 1;
  spatial.core.v1.Request request = 2;
}
message LocalForegroundPresent {
  spatial.core.v1.ActorLocalViewIdentity identity = 1;
  uint32 width = 2;
  uint32 height = 3;
}
message LocalForegroundPoll {
  uint64 serial = 1;
  uint32 maximum_steps = 2;
}
message LocalForegroundProgress {
  enum Stage { BIND = 0; SELECT = 1; PRESENT = 2; }
  uint64 serial = 1;
  Stage stage = 2;
  bool submitted = 3;
  bool cancelled = 4;
}
// Trusted test inspection only. It cannot grant actor authority.
message LocalForegroundRetirement {
  spatial.core.v1.ActorLocalViewIdentity identity = 1;
  bool presentation_only = 2; // False preserves full context-retirement semantics.
}
message LocalForegroundCleanupPoll {
  spatial.core.v1.ActorLocalViewIdentity identity = 1;
  uint32 maximum_steps = 2;
}
message LocalForegroundCleanup {
  enum Stage { NONE = 0; SELECTION = 1; NATIVE = 2; WORLD_DRAIN = 3; RELEASE = 4; INSPECT = 5; }
  bool pending = 1;
  bool attested = 2;
  bool native_retired = 3;
  bool releases_binding = 4;
  Stage stage = 5;
  uint64 serial = 6;
}
message SessionProbeRequest {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof operation {
    spatial.core.v1.Request world = 10;
    spatial.core.v1.Request broker = 11;
    spatial.workspace.v1.ControlOwner inspect = 12;
    spatial.workspace.v1.ControlOwner stop_world = 13;
    spatial.supervisor.v1.AuthorityLaunchQuery stop_session = 14;
    spatial.workspace.v1.ControlOwner recover_world = 15;
    spatial.workspace.v1.ControlOwner retire_world = 16;
    spatial.supervisor.v1.AuthorityLaunchQuery stop_broker = 17;
    spatial.supervisor.v1.AuthorityLaunchQuery retire_broker = 18;
    spatial.workspace.v1.ControlOwner recover_stopped_broker_world = 19;
    SessionWorldStart start_world = 20;
    SessionWorldCall owned_world = 21;
    LocalForegroundPresent local_present = 22;
    spatial.core.v1.ActorLocalViewIdentity local_retire = 23;
    LocalForegroundPresent local_begin = 24;
    LocalForegroundPoll local_poll = 25;
    uint64 local_cancel = 26;
    LocalForegroundRetirement local_defer_retire = 27;
    LocalForegroundCleanupPoll local_cleanup_poll = 28;
  }
}
message SessionProbeReply {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof outcome {
    spatial.core.v1.Reply result = 10;
    spatial.workspace.v1.ControlOwnerState owner = 11;
    spatial.supervisor.v1.AuthorityLaunchRecord cleanup = 12;
    spatial.core.v1.Error error = 13;
    spatial.identity.v1.AuthorityRetirementState retirement = 14;
    spatial.supervisor.v1.AuthorityDependentCleanup dependent = 15;
    SessionWorldStarted started = 16;
    spatial.core.v1.ActorLocalViewState local_frame = 22;
    bool local_retired = 23;
    LocalForegroundProgress local_progress = 24;
    bool local_cancelled = 26;
    LocalForegroundCleanup local_cleanup = 27;
  }
}
