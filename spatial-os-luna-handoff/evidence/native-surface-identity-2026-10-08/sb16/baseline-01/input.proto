syntax = "proto3";
package spatial.input.v1;
import "security.proto";

// Private compositor-to-server interface. The authenticated X connection must
// own SubstructureRedirect on the server root. Actor grants remain in worldd.
message Empty {}
message Seat { fixed64 id = 1; }
message Inspect { fixed32 xid = 1; }
message Target { fixed32 xid = 1; fixed64 generation = 2; }
message Button {
  fixed64 seat = 1;
  Target target = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 button = 5;
  bool pressed = 6;
  bool focus = 7;
  // Preserve the last captured position for additional buttons and release.
  bool keep_capture_position = 8;
}
message Motion {
  fixed64 seat = 1;
  Target target = 2;
  sint32 x = 3;
  sint32 y = 4;
}
message Key { fixed64 seat = 1; uint32 keycode = 2; bool pressed = 3; }
message Request {
  uint32 protocol_version = 1;
  fixed64 request_id = 2;
  oneof operation {
    Empty open = 3;
    Inspect inspect = 4;
    Button button = 5;
    Key key = 6;
    Seat cancel = 7;
    Seat close = 8;
    Seat status = 9;
    Motion motion = 10;
  }
}
enum Code {
  OK = 0;
  INVALID_ARGUMENT = 1;
  FORBIDDEN = 2;
  NO_SEAT = 3;
  STALE_TARGET = 4;
  NO_FOCUS = 5;
  BUSY = 6;
  RESOURCE_LIMIT = 7;
}
message Reply {
  uint32 protocol_version = 1;
  fixed64 request_id = 2;
  Code code = 3;
  fixed64 seat = 4;
  uint32 pointer_device = 5;
  uint32 keyboard_device = 6;
  Target target = 7;
  uint32 width = 8;
  uint32 height = 9;
  fixed32 held_buttons = 10;
  bytes held_keys = 11;
  Target focus = 12;
  spatial.security.v1.ApplicationIdentity application_identity = 13;
  optional bool security_enabled = 14;
}
