syntax = "proto3";
package spatial.identity.v1;
import "core.proto";
import "key.proto";

enum EnrollmentMode { ENROLLMENT_MODE_UNSPECIFIED = 0; MANUAL = 1; APPROVE_ALWAYS = 2; }
message EnrollmentPolicy {
  EnrollmentMode mode = 1;
  string bootstrap_profile = 2; // Opaque profile reference. It is not a grant.
}
message PolicyState { EnrollmentPolicy policy = 1; uint64 revision = 2; }
message PolicyRead {}
message PolicySet { EnrollmentPolicy policy = 1; optional uint64 expected_revision = 2; }
message IssuerOperation {
  oneof action {
    PolicyRead policy_read = 1;
    PolicySet policy_set = 2;
    EnrollmentRead enrollment_read = 3;
    EnrollmentDecision enrollment_decision = 4;
    IdentityReference identity_read = 5;
    IdentityRevoke identity_revoke = 6;
  }
}
enum ActorKind { ACTOR_KIND_UNSPECIFIED = 0; HUMAN = 1; AGENT = 2; }
message EnrollmentIntent { bytes public_key = 1; ActorKind kind = 2; string label = 3; }
enum EnrollmentStatus { ENROLLMENT_STATUS_UNSPECIFIED = 0; PENDING = 1; APPROVED = 2; REJECTED = 3; }
enum EnrollmentChoice { ENROLLMENT_CHOICE_UNSPECIFIED = 0; APPROVE_NEW = 1; APPROVE_EXISTING = 2; REJECT = 3; }
message EnrollmentRead { bytes enrollment_id = 1; }
message EnrollmentDecision {
  bytes enrollment_id = 1;
  EnrollmentChoice choice = 2;
  bytes target_actor_id = 3;
  optional uint64 expected_policy_revision = 4;
}
message ActorCredential {
  uint32 protocol_version = 1;
  bytes issuer_id = 2;
  bytes actor_id = 3;
  bytes credential_id = 4;
  bytes public_key = 5;
  ActorKind kind = 6;
  bytes enrollment_id = 7;
  string bootstrap_profile = 8;
  uint64 bootstrap_profile_revision = 9;
  uint64 policy_revision = 10;
  string audience = 11;
}
message SignedCredential { SignRequest content = 1; KeyProof proof = 2; }
message EnrollmentRecord {
  bytes enrollment_id = 1;
  EnrollmentIntent intent = 2;
  EnrollmentStatus status = 3;
  SignedCredential credential = 4;
}
message EnrollmentChallenge {
  uint32 protocol_version = 1;
  bytes issuer_id = 2;
  bytes incarnation = 3;
  bytes nonce = 4;
  EnrollmentIntent intent = 5;
  uint32 lifetime_ms = 6;
  string audience = 7;
}
message EnrollmentComplete { bytes nonce = 1; KeyProof proof = 2; }
enum IdentityTargetKind { IDENTITY_TARGET_UNSPECIFIED = 0; CREDENTIAL_TARGET = 1; ACTOR_TARGET = 2; }
message IdentityReference { IdentityTargetKind kind = 1; bytes id = 2; }
message IdentityRevoke {
  IdentityReference target = 1;
  optional uint64 expected_security_revision = 2;
  string reason = 3;
}
message IdentityStatus {
  bytes issuer_id = 1;
  bytes actor_id = 2;
  bytes credential_id = 3;
  ActorKind kind = 4;
  bool actor_revoked = 5;
  bool credential_revoked = 6;
  bool active = 7;
  uint64 security_revision = 8;
}
// Read-only service query. Actor validity is independent of any one credential.
// Keep request order. Require between one and 128 distinct 32-byte identities.
message ActorStatusRead { repeated bytes actor_ids = 1; }
message ActorState {
  bytes actor_id = 1;
  bool known = 2;
  bool revoked = 3;
  bool active = 4;
}
message ActorStatusBatch {
  bytes issuer_id = 1;
  uint64 security_revision = 2;
  repeated ActorState actors = 3;
}
message AuthenticationBegin {
  SignedCredential credential = 1;
  string audience = 2;
  bytes channel_binding = 3;
}
message AuthenticationChallenge {
  uint32 protocol_version = 1;
  bytes issuer_id = 2;
  bytes incarnation = 3;
  bytes nonce = 4;
  AuthenticationBegin request = 5;
  uint32 lifetime_ms = 6;
}
message AuthenticationComplete { bytes nonce = 1; KeyProof proof = 2; }
message AuthenticationResult {
  IdentityStatus identity = 1;
  string audience = 2;
  bytes channel_binding = 3;
}
message AdminResult {
  oneof outcome { PolicyState policy = 1; EnrollmentRecord enrollment = 2; IdentityStatus identity_status = 3; }
}
message IssuerInfoRequest {}
// Trusted supervisor configuration. Paths are absolute and remain outside Git.
// TLS service certificates do not grant actor or issuer-owner authority.
message IssuerTlsServerConfig {
  uint32 protocol_version = 1;
  string certificate_path = 2;
  string private_key_path = 3;
  string client_ca_path = 4;
  optional uint32 io_timeout_ms = 5; // 50..60000; default 5000.
  optional uint32 idle_timeout_ms = 6; // 50..300000; default 60000.
  optional uint32 connection_limit = 7; // 1..128; default 32.
}
message IssuerTlsClientConfig {
  uint32 protocol_version = 1;
  string address = 2; // Numeric IPv4 or IPv6 address. No implicit DNS lookup.
  uint32 port = 3;
  string server_name = 4; // Expected DNS subject alternative name and TLS SNI.
  string server_ca_path = 5;
  string certificate_path = 6;
  string private_key_path = 7;
  bytes issuer_id = 8;
  bytes issuer_public_key = 9;
  optional uint32 io_timeout_ms = 10; // 50..60000; default 5000.
}
message IssuerInfo { bytes issuer_id = 1; bytes public_key = 2; uint64 policy_revision = 3; }
message IssuerChallenge {
  uint32 protocol_version = 1;
  bytes issuer_id = 2;
  bytes incarnation = 3;
  bytes nonce = 4;
  bytes owner_public_key = 5;
  IssuerOperation operation = 6;
  uint32 lifetime_ms = 7;
  string audience = 8;
}
message ChallengeReply { bytes nonce = 1; SignRequest signing_request = 2; }
message IssuerExecute { bytes nonce = 1; KeyProof proof = 2; }
// No cursor requests a current baseline, without historical events.
// A present cursor requests contiguous committed events after that revision.
message RevocationRead { optional uint64 after_revision = 1; uint32 wait_ms = 2; }
message RevocationEvent { uint64 revision = 1; IdentityReference target = 2; }
message RevocationBatch {
  bytes issuer_id = 1;
  uint64 from_revision = 2;
  uint64 through_revision = 3;
  uint64 head_revision = 4;
  bool initial = 5;
  repeated RevocationEvent events = 6;
}
message RevocationUpdate {
  uint32 protocol_version = 1;
  oneof outcome { RevocationBatch batch = 2; spatial.core.v1.Error error = 3; }
}
message IssuerRequest {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof operation {
    spatial.core.v1.HelloRequest hello = 10;
    IssuerInfoRequest info = 11;
    IssuerOperation challenge = 12;
    IssuerExecute execute = 13;
    EnrollmentIntent enrollment_begin = 14;
    EnrollmentComplete enrollment_complete = 15;
    AuthenticationBegin authentication_begin = 16;
    AuthenticationComplete authentication_complete = 17;
    SignedCredential credential_check = 18;
    RevocationRead revocations = 19;
    ActorStatusRead actor_status = 20;
  }
}
message IssuerReply {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof outcome {
    spatial.core.v1.HelloReply hello = 10;
    IssuerInfo info = 11;
    ChallengeReply challenge = 12;
    PolicyState policy = 13;
    spatial.core.v1.Error error = 14;
    EnrollmentRecord enrollment = 15;
    IdentityStatus identity_status = 16;
    AuthenticationResult authentication = 17;
    RevocationBatch revocations = 18;
    ActorStatusBatch actor_status = 19;
  }
}
