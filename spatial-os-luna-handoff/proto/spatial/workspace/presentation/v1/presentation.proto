syntax = "proto3";
package spatial.workspace.presentation.v1;
import "core.proto";

// Filtered view. Never add workspace identity or workspace metadata here.
message PresentationView {
  bytes representation_id = 1;
  string room_id = 2;
  spatial.core.v1.Pose transform = 3;
  uint64 generation = 4;
  bool locked = 5;
}
// Private broker/world interface. Resolve only after fresh world and workspace
// authority checks. This request and its reply are never exposed to actors.
message PresentationResolveRequest { bytes representation_id = 1; }
message PresentationResolveReply { string workspace_id = 1; }
